<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFCF9"/>
      <stop offset="100%" stop-color="#F7F4EC"/>
    </linearGradient>
    <linearGradient id="curveTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE7D6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F5EFE2" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Certificate Paper Background -->
  <rect width="800" height="1050" fill="url(#paperBg)"/>

  <!-- Subtle Diagonal Wave Watermark -->
  <path d="M0,780 C280,680 620,420 740,0 L800,0 L800,320 C680,620 350,860 0,940 Z" fill="url(#curveTint)"/>
  <path d="M0,840 C310,740 650,480 800,80 L800,140 C660,520 320,780 0,880 Z" fill="#EAE0CC" opacity="0.35"/>

  <!-- Subtle Outer Border -->
  <rect x="18" y="18" width="764" height="1014" fill="none" stroke="#E5DEC9" stroke-width="2"/>

  <!-- Top Red ISTQB Swoosh -->
  <path d="M315,92 C365,62 435,34 485,24 C455,44 395,70 338,104 Z" fill="#D1192E"/>

  <!-- ISTQB Wordmark -->
  <text x="268" y="142" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#123C73" letter-spacing="2">ISTQB</text>
  <text x="456" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#123C73">®</text>

  <!-- Red Vertical Bar & Subtitle -->
  <path d="M316,158 L328,158 L320,196 L316,196 Z" fill="#D1192E"/>
  <text x="338" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#123C73">International Software</text>
  <text x="338" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#123C73">Testing Qualifications Board</text>

  <!-- Body Copy -->
  <text x="400" y="255" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" fill="#1E242B">This is to certify that</text>

  <text x="400" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" font-style="italic" fill="#11161D">Mr Kavindu Sachintha Jayarathna</text>

  <text x="400" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1E242B">having satisfied the requirements of the</text>
  <text x="400" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1E242B">International Software Testing Qualification Board</text>
  <text x="400" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1E242B">has been awarded the</text>

  <!-- Awarded Credential Title -->
  <text x="400" y="528" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#15467A">ISTQB Certified Tester Foundation Level</text>
  <text x="400" y="568" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#15467A">(CTFL; Core) v4.0</text>

  <!-- Date & Certificate Number -->
  <text x="400" y="642" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="600" fill="#2A3038">On</text>
  <text x="400" y="684" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" font-weight="700" fill="#11161D">September 27th, 2026</text>

  <text x="400" y="746" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="600" fill="#2A3038">Certificate Number</text>
  <text x="400" y="786" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" font-weight="700" fill="#11161D" letter-spacing="0.5">SL-CTFL-2609-7949</text>

  <!-- Footer Signatures & SLSTB Badge -->
  <line x1="55" y1="935" x2="255" y2="935" stroke="#555" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="155" y="962" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E242B">Director - Examinations</text>

  <rect x="330" y="895" width="140" height="72" rx="10" fill="#FFFDF7" stroke="#D4AF37" stroke-width="2"/>
  <text x="400" y="934" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#111">SLSTB</text>
  <text x="400" y="954" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#B8860B">Sri Lanka Software Testing Board</text>

  <line x1="545" y1="935" x2="745" y2="935" stroke="#555" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="645" y="962" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E242B">Board Member - SLSTB</text>
</svg>
